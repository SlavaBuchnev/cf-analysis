app {
    cache {
        capacity = 100
        ttl = 1 hour
        idle-ttl = 15 minutes
        refresh-after = 1 minutes
        recent-count = 100
        reaper-interval = 1 minute
        warmup-contest-ids = [551173]
    }

    http-server {
        host = ${HTTP}
        port = ${PORT}
        max-header-size = 16KiB
        max-initial-line-length = 8KiB
        keep-alive = true
        idle-timeout = 60s
        graceful-shutdown-timeout = 20s
    }

    # Rate limiter: не более max запросов за interval
    rate-limiter {
        max = 1
        interval = 2 seconds
    }

    cf-api {
        key = ${KEY}
        secret = ${SECRET}
        log-full-uri = false
        http-client {
            request-timeout = 15 seconds
            connection-timeout = 5 seconds
            retry-base-delay = 1 second
            retry-max-delay = 10 seconds
            retry-max-attempts = 3
            circuit-breaker {
                type = failure-count
                reset-timeout = 60 seconds
                parameters {
                    max-failures = 3
                }
            }
        }
    }

    cors {
        enabled = false
        allowed-origins = []
        allowed-methods = ["GET"]
        allowed-headers = ["Content-Type"]
        max-age = 30 minutes
    }
}