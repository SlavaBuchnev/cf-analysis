version = "3.8.6"
runner.dialect = scala3
maxColumn = 120

align {
  preset = none
  stripMargin = true
}
assumeStandardLibraryStripMargin = true

rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  Imports,
  SortModifiers
]

rewrite.imports {
  sort = ascii
  groups = [
    ["scala\\..*", "java\\..*", "javax\\..*"],   # стандартная библиотека
    ["zio\\..*", "izumi\\..*", "sttp\\..*"],     # ZIO-экосистема
    ["cf\\..*"]                         # ваш собственный код
  ]
}

rewrite.trailingCommas.style = always