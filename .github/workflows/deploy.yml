          #   -H "Authorization: Bearer ${{ secrets.KOYEB_API_TOKEN }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"definition": {"docker": {"image": "${{ secrets.DOCKER_USERNAME }}/cf-analysis:${{ inputs.image_tag }}"}}}'
