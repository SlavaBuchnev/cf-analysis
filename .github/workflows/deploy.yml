name: Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker-тег (например, dev-latest, master-latest, v1.0.0, mvp)'
        required: true
        default: 'dev-latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_DEV_SERVICE_ID }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/cf-analysis:${{ inputs.image_tag }}
        run: |
          echo "Setting Render image to $DOCKER_IMAGE..."

          # 1. Обновляем образ сервиса
          curl -sf -X PATCH "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"image\": {\"imagePath\": \"$DOCKER_IMAGE\"}}" \
            > /dev/null

          # 2. Запускаем деплой через hook и забираем deploy id
          RESPONSE=$(curl -sf -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}")
          echo "Hook response: $RESPONSE"

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.deploy.id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Не удалось получить deploy id из ответа hook"
            exit 1
          fi
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deploy ID: $DEPLOY_ID"

      - name: Wait for deploy to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_DEV_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          SUCCESS_STATUSES="live"
          FAILURE_STATUSES="build_failed update_failed canceled pre_deploy_failed deactivated"

          MAX_ATTEMPTS=60   # 60 * 20s = 20 минут максимум
          ATTEMPT=0
          STATUS=""

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT + 1))

            RESPONSE=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID") || {
                echo "::warning::Не удалось получить статус деплоя, повтор..."
                sleep 20
                continue
              }

            STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
            echo "[$ATTEMPT/$MAX_ATTEMPTS] status = $STATUS"

            if [ "$STATUS" = "$SUCCESS_STATUSES" ]; then
              echo "✅ Deploy $DEPLOY_ID успешно завершён (status: $STATUS)"
              exit 0
            fi

            for s in $FAILURE_STATUSES; do
              if [ "$STATUS" = "$s" ]; then
                echo "::error::Deploy $DEPLOY_ID провалился со статусом: $STATUS"
                echo "Ответ API:"
                echo "$RESPONSE" | jq '.'
                exit 1
              fi
            done

            sleep 20
          done

          echo "::error::Таймаут ожидания деплоя. Последний статус: $STATUS"
          exit 1