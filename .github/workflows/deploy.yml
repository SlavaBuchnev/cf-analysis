name: Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Куда деплоить'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: 'Docker-тег (например, dev-latest, master-latest, v1.0.0, mvp)'
        required: true
        default: 'dev-latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render (dev)
        if: inputs.environment == 'dev'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_DEV_SERVICE_ID }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/cf-analysis:${{ inputs.image_tag }}
        run: |
          echo "Setting Render image to $DOCKER_IMAGE..."

          curl -X PATCH "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"image\": {\"imagePath\": \"$DOCKER_IMAGE\"}}"

          curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}"

      - name: Deploy to Koyeb (prod)
        if: inputs.environment == 'prod'
        run: |
          echo "Setting Koyeb image to cf-analysis:${{ inputs.image_tag }}..."
