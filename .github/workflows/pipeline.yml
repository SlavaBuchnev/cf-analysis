name: Pipeline

on:
  push:
    branches:
      - '**'  # Все ветки

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/setup-scala

      - name: Unit test
        run: sbt test

  documentation:
    needs: testing
    if: github.ref_name == 'master'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/setup-scala

      - name: Generate Scaladoc
        run: sbt doc

      - name: Locate and stage docs
        run: |
          API_DIR=$(find target -type d -name api -exec test -f {}/index.html \; -print -quit)
          if [ -z "$API_DIR" ]; then
            echo "::error::Не найден каталог api с index.html. Содержимое target:"
            find target -maxdepth 4 -type d | sort
            exit 1
          fi
          echo "Найден каталог документации: $API_DIR"
          mkdir -p _site
          cp -r "$API_DIR"/. _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/setup-scala

      - name: Compute Docker tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAG="master-latest"
          else
            TAG="dev-latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Computed tag: $TAG (branch: ${{ github.ref_name }})"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish Docker image
        run: sbt Docker/publish
        env:
          DOCKER_TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}