name: Pipeline

on:
  push:
    branches:
      - '**'  # Все ветки

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/actions/setup-scala

      - name: Compile
        run: sbt Test/compile

      - name: Check formatting
        run: sbt scalafmtCheckAll

      - name: Unit test
        run: sbt test

  documentation:
    needs: testing
    if: github.ref_name == 'master'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/actions/setup-scala

      - name: Generate Scaladoc
        run: sbt doc

      - name: Locate and stage docs
        run: |
          API_DIR=$(find target -type d -name api -exec test -f {}/index.html \; -print -quit)
          if [ -z "$API_DIR" ]; then
            echo "::error::Не найден каталог api с index.html. Содержимое target:"
            find target -maxdepth 4 -type d | sort
            exit 1
          fi
          echo "Найден каталог документации: $API_DIR"
          mkdir -p _site
          cp -r "$API_DIR"/. _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: testing
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/actions/setup-scala

      - name: Compute Docker tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAG="master-latest"
          else
            TAG="dev-latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Computed tag: $TAG (branch: ${{ github.ref_name }})"

      - name: Compute GHCR image name
        if: github.ref_name == 'master'
        id: ghcr
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build image (без пуша)
        run: sbt Docker/publishLocal
        env:
          DOCKER_TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Publish to Docker Hub
        uses: ./.github/actions/docker-push
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          source-image: ${{ secrets.DOCKER_USERNAME }}/cf-analysis:${{ steps.tag.outputs.tag }}
          target-image: ${{ secrets.DOCKER_USERNAME }}/cf-analysis
          tags: ${{ steps.tag.outputs.tag }}

      - name: Publish to GitHub Packages (только master)
        if: github.ref_name == 'master'
        uses: ./.github/actions/docker-push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          source-image: ${{ secrets.DOCKER_USERNAME }}/cf-analysis:${{ steps.tag.outputs.tag }}
          target-image: ${{ steps.ghcr.outputs.image }}
          # latest — мутабельный указатель на последний зелёный master (в ghcr он однозначен: туда пушится только master)
          tags: ${{ steps.tag.outputs.tag }} latest

      # Описание репозитория Docker Hub обновляем только из master, чтобы фича-ветки не затирали витрину
      - name: Update Docker Hub description
        if: github.ref_name == 'master'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/cf-analysis
          readme-filepath: ./Readme.md