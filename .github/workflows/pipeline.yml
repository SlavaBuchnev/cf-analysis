name: Pipeline

on:
  push:
    branches:
      - '**'  # Все ветки

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/setup-scala

      - name: Unit test
        run: sbt test

  documentation:
    needs: testing
    if: github.ref_name == 'master'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/setup-scala

      - name: Generate Scaladoc
        run: sbt doc

      - name: Debug target dir
        run: |
          echo "=== target tree (up to 4 levels) ==="
          find target -maxdepth 4 -type d | sort
          echo
          echo "=== anything ending in /api ==="
          find target -type d -name api
          echo
          echo "=== .html files under target ==="
          find target -name '*.html' | head -20
          echo
          echo "=== resolved doc target per sbt ==="
          sbt --error --batch "show Compile / doc / target" | tail -n1  

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r target/scala-*/api/* _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Scala
        uses: ./.github/setup-scala

      - name: Compute Docker tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAG="master-latest"
          else
            TAG="dev-latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Computed tag: $TAG (branch: ${{ github.ref_name }})"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish Docker image
        run: sbt Docker/publish
        env:
          DOCKER_TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}